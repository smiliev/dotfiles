# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  bindings.commands:
    global:
      normal:
        .: null
        <Alt+o>: download-open
        <Ctrl+Alt+j>: cmd-run-with-count 3 scroll down
        <Ctrl+Alt+k>: cmd-run-with-count 3 scroll up
        <Ctrl+Shift+j>: cmd-run-with-count 3 scroll down
        <Ctrl+j>: cmd-run-with-count 2 scroll down
        <Ctrl+k>: cmd-run-with-count 2 scroll up
        J: tab-prev
        K: tab-next
        R: adblock-update ;; reload -f
        j: scroll down
        r: reload
  scrolling.smooth:
    global: true
